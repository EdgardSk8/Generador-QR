<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Plataforma QR</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <main class="landing-body">
    <div class="landing-card">
      <div class="landing-avatar" style="display:grid;place-items:center;color:var(--muted)">
        <svg class="icon icon-lg"><use href="#i-alert"/></svg>
      </div>
      <div>
        <h1 class="landing-title">{{ title }}</h1>
        <p class="landing-sub">{{ message }}</p>
      </div>
      <a class="landing-btn" href="/">Ir a la plataforma</a>
      <p class="landing-foot">Código de estado: {{ status }}</p>
    </div>
  </main>
</body>
</html>
